# Galapsy′ — mise en ligne sur Netlify (rien à régler à la main)
# Le site est rangé dans les archives galapsy-*.zip : Netlify les décompresse,
# ajoute config.js (connexion à la base partagée), puis publie le dossier « site ».
[build]
  command = "python3 -c \"import zipfile, glob, shutil; [zipfile.ZipFile(f).extractall('site') for f in sorted(glob.glob('galapsy-*.zip'))]; shutil.copy('config.js', 'site/config.js')\""
  publish = "site"
